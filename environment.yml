name: opengate_env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - root
  - numpy
  - scipy
  - matplotlib
  - pandas
  - uproot
  - awkward
  - jupyter
  - ipywidgets
  - ipykernel
  - pip
  - pip:
    - opengate==10.0.3
    - gatetools
    - simpleitk
    - pydicom
    - itk
    - pyvista
    - vtk
    - tqdm
    - loguru
    - radioactivedecay
    - spekpy
